name: Windows, macOS and Linux attendance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fresh checkout installs its own dependencies
        run: node -e "require('./scripts/start.cjs').ensureDependencies()"
      - run: npm run check
      - name: Optional setup remains compatible
        run: npm run laptop:setup
      - name: Install command must work without systemd
        run: npm run host:install
      - name: Three 700-student bursts with a separate server and disk database
        env:
          BP_BENCH_COUNTS: '700'
        run: node scripts/bench-web.cjs
      - name: Startup, QR security, persistence, attendance and exports
        if: always()
        run: node --test tests/portable-host.test.cjs tests/launcher.test.cjs tests/lan-qr.test.cjs tests/lan.test.cjs tests/lan-reports.test.cjs tests/lan-restart.test.cjs
